<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Робот Біт">
  <!-- Робот Біт — наскрізний персонаж 5-А, перемальований у гамі сайту.
       Персонажа НЕ змінено: той самий робот, лише сучасніша подача.
       Написано кодом: чіткий і на 24 px, і на 512 px, працює у світлій
       і темній темі, важить менше кілобайта. -->
  <defs>
    <linearGradient id="bg" x1="14" y1="12" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a2f"/>
      <stop offset=".55" stop-color="#ff5f8a"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f8a"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- антена -->
  <path d="M32 13V8" stroke="url(#ear)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="5.5" r="3.5" fill="#ff7a2f"/>

  <!-- «вуха» -->
  <rect x="6.5" y="26" width="5" height="12" rx="2.5" fill="url(#ear)"/>
  <rect x="52.5" y="26" width="5" height="12" rx="2.5" fill="url(#ear)"/>

  <!-- голова -->
  <rect x="13" y="13" width="38" height="34" rx="12" fill="url(#bg)"/>

  <!-- візор: одне темне вікно замість двох окремих очей — так читається
       навіть на 24 px, і саме так виглядають сучасні іконки роботів -->
  <rect x="19" y="21" width="26" height="14" rx="7" fill="#0f1017" opacity=".9"/>
  <circle cx="26.5" cy="28" r="3.2" fill="#7fe9ff"/>
  <circle cx="37.5" cy="28" r="3.2" fill="#7fe9ff"/>

  <!-- усмішка: дуга, а не планка — Біт персонаж 5-А, він мусить бути дружнім -->
  <path d="M26 39.6q6 4.6 12 0" fill="none" stroke="#fff" stroke-width="3"
        stroke-linecap="round" opacity=".9"/>

  <!-- плечі -->
  <path d="M20 52c0-3.3 2.7-6 6-6h12c3.3 0 6 2.7 6 6v3H20z" fill="url(#ear)" opacity=".9"/>
</svg>
